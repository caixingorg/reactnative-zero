plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.enterprise.rntemplate.modules'
version = '1.0.0'

android {
  namespace "expo.modules.paymentalipay"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // 原因：遵循支付宝开放平台最新规范（15.8.09+），通过 Maven Central 引入官方 Android 支付 SDK，绝不提交闭源 .aar 进仓库
  implementation 'com.alipay.sdk:alipaysdk-android:15.8.42'
}
