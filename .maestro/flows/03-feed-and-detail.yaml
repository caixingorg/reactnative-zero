appId: ${MAESTRO_APP_ID || 'com.enterprise.rntemplate.dev'}
name: 03 - 4-Tab Navigation and Settings Entry Flow
---
# 1. 验证 4 栏底导切换（首页 -> 发现 -> 消息 -> 我的）
- assertVisible: '推荐'
- tapOn: '发现'
- assertVisible: '广场'
- tapOn: '消息'
- assertVisible: '通知'
- tapOn: '我的'
- assertVisible: '收藏'

# 2. 从「我的」右上角进入个人设置页
- tapOn:
    id: 'profile-settings-button'
- assertVisible: '个人设置'
