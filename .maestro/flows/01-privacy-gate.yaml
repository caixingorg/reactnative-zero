appId: ${MAESTRO_APP_ID || 'com.enterprise.rntemplate.dev'}
name: 01 - Welcome Guide and Privacy Consent Checkbox Gate
---
# 1. 首次冷启动展示静态欢迎引导页（零三方 SDK 唤醒），点击跳过进入登录页
- assertVisible: '清晰的三层应用骨架'
- tapOn: '跳过'
- assertVisible: '账号登录'

# 2. 未勾选隐私协议前点击登录，验证合规拦截提示
- tapOn: '请输入账号'
- inputText: 'admin'
- tapOn: '请输入密码'
- inputText: 'password123'
- hideKeyboard
- tapOn: '登录'
- assertVisible: '请先阅读并勾选同意《用户协议》与《隐私政策》'
